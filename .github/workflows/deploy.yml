name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Error gate: nothing reaches katuro.website unless lint has no errors
      # and every test passes. (Warnings are allowed; errors and failures stop
      # the deploy and the live site keeps the last good version.)
      - run: npx eslint . --quiet
      - run: npm test

      - run: npm run build

      # BrowserRouter needs a fallback for deep links/refreshes -- GitHub Pages
      # has no server-side rewrite, so 404.html re-serves the app shell and
      # react-router takes over client-side from there.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
